name: Python package

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6
      - name: UV setup
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format .
      - name: Typecheck
        run: uv run ty check
      - name: Tests
        run: uv run pytest -q
